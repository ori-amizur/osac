apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.configAsCode }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
secrets:
  - name: {{ .Values.serviceAccounts.configAsCode }}-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osac-aap-config-as-code-license-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.configAsCode.manifestSecret }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osac-aap-config-as-code-license-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osac-aap-config-as-code-license-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.configAsCode }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccounts.configAsCode }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccounts.configAsCode | quote }}
type: kubernetes.io/service-account-token
