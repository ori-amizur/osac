---
- name: Materialize remote cluster kubeconfig from its injected Secret value
  ansible.builtin.copy:
    content: "{{ lookup('env', 'OSAC_REMOTE_CLUSTER_KUBECONFIG_CONTENT') }}"
    dest: /tmp/osac-remote-cluster-kubeconfig
    mode: "0600"
  no_log: true
  when: lookup('env', 'OSAC_REMOTE_CLUSTER_KUBECONFIG_CONTENT') | length > 0

- name: Get remote cluster kubeconfig
  vars:
    _remote_kubeconfig_content: "{{ lookup('env', 'OSAC_REMOTE_CLUSTER_KUBECONFIG_CONTENT') }}"
    _remote_kubeconfig_path: "{{ lookup('env', 'OSAC_REMOTE_CLUSTER_KUBECONFIG') }}"
  ansible.builtin.set_fact:
    remote_cluster_kubeconfig: >-
      {{ _remote_kubeconfig_content | ternary(
           '/tmp/osac-remote-cluster-kubeconfig',
           _remote_kubeconfig_path
         ) }}
  when: _remote_kubeconfig_content | length > 0 or _remote_kubeconfig_path | length > 0
