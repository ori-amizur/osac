argument_specs:
  acquire:
    description: >-
      Acquire a K8s Lease for exclusive V-Net access. Retries until the Lease
      is available or expired, using resourceVersion CAS to prevent races.
    options:
      vnet_lock_name:
        type: str
        required: true
        description: Name of the Lease resource (e.g. netris-vnet-lock-<subnet-name>)
      vnet_lock_namespace:
        type: str
        required: true
        description: Namespace of the Lease resource
      vnet_lock_holder:
        type: str
        required: true
        description: Unique identifier for this lock holder (e.g. AAP job ID)
      vnet_lock_kubeconfig:
        type: str
        required: false
        description: Optional kubeconfig for the cluster containing the Lease
      vnet_lock_duration_seconds:
        type: int
        required: false
        default: 600
        description: Lease expiry interval used as the crash-recovery safety net
      vnet_lock_tenant:
        type: str
        required: false
        description: Tenant identifier for tenant-isolation metadata on the Lease
      vnet_lock_owner_reference:
        type: str
        required: false
        description: Owner/reference identifier for tenant-isolation metadata on the Lease
  release:
    description: >-
      Release a previously acquired K8s Lease. No-op if the Lease is held
      by a different holder (e.g. after expiry takeover).
    options:
      vnet_lock_name:
        type: str
        required: true
        description: Name of the Lease resource
      vnet_lock_namespace:
        type: str
        required: true
        description: Namespace of the Lease resource
      vnet_lock_holder:
        type: str
        required: true
        description: Holder identity to match before releasing
      vnet_lock_kubeconfig:
        type: str
        required: false
        description: Optional kubeconfig for the cluster containing the Lease
