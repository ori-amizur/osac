---
# Default labels for CUDN resources
default_subnet_labels:
  osac.openshift.io/managed-by: osac-fulfillment

# Layer2 defaults
default_layer2_role: Primary
default_ipam_lifecycle: Persistent

# The fabric manager publishes a VN-scoped transit contract in the parent
# networking namespace. Names are derived from the VN UUID by the create path;
# these defaults remain useful for contract-only tests that inject data.
cudn_net_evpn_transit_cudn_name: osac-evpn-transit
cudn_net_evpn_transit_configmap_name: osac-evpn-transit
cudn_net_evpn_transit_configmap_wait_retries: 60
cudn_net_evpn_transit_configmap_wait_delay_seconds: 2
cudn_net_evpn_transit_wait_ready: true
cudn_net_evpn_transit_ready_retries: 60
cudn_net_evpn_transit_ready_delay_seconds: 2
cudn_net_evpn_transit_patch_port_security: true
cudn_net_evpn_transit_ipam_claim_name: transit

# Router pod defaults for Secondary VirtualNetworks.
router_pod_name: router
router_pod_image: ghcr.io/osac-project/osac-router-agent:latest
router_pod_service_account_name: router-pod
router_pod_config_map_name: router-config
router_pod_config_file: /etc/osac-router-agent/config/config.json
router_pod_status_file: /run/osac-router-agent/status.json
# Fixed cluster-scoped ClusterRole name from osac-installer's router-pod-scc.yaml
# (not release-namespace-qualified -- see that file's own naming note).
router_pod_scc_cluster_role: osac-router-pod-scc
# Test and staged-provisioning hook: keep the CUDN resource path independently
# testable when the cluster does not provide live UDN attachment support. The
# production default preserves the complete Secondary Subnet workflow.
cudn_net_manage_router_pod: true

# Live router Pod mutation defaults. The timeout starts after the Pod annotation
# is patched. Each Subnet operation has its own deadline; a later operation does
# not extend an earlier one. The Lease mutex prevents overlapping AAP jobs from
# writing stale aggregate Pod/ConfigMap state.
cudn_net_router_live_attach_timeout_seconds: 60
cudn_net_router_live_attach_poll_interval_seconds: 2
cudn_net_router_wait_for_network_status: true
cudn_net_router_wait_for_recreated_network_status: true
cudn_net_router_mutation_lock_retries: 180
cudn_net_router_mutation_lock_delay_seconds: 1
cudn_net_router_mutation_lock_duration_seconds: 600
cudn_net_router_recovery_timeout_seconds: 180
cudn_net_router_recovery_poll_interval_seconds: 2
cudn_net_router_recovery_lock_duration_seconds: 600

# How long to wait for a newly-created CUDN's NetworkAttachmentDefinition to appear
# before continuing to the normal live-attach verification (see
# create_cudn_for_live_attach.yaml). Best-effort: exceeding this does not fail the Subnet
# operation -- it falls through to patch_router_pod_networks.yaml's own live-attach
# timeout and recreation fallback. The pre-CUDN annotation is formatted so that the
# caller's normal compact-JSON patch becomes a safe, meaningful Multus retry trigger
# after the NAD exists, without toggling the desired attachment list.
cudn_net_router_nad_wait_timeout_seconds: 30
cudn_net_router_nad_wait_poll_interval_seconds: 2

# Live detach: OVN-Kubernetes's own CNI DEL handler cannot process a detach triggered by
# removing the Pod's Multus annotation entry -- it re-resolves the NAD from that same,
# already-changed annotation (see live_detach_cni_del.yaml). The role instead calls
# Multus's own "/delegate" socket directly from a short-lived, node-scoped helper Pod,
# before the Pod's annotation is ever touched. The helper image only needs to provide
# curl -- crictl is hostPath-mounted from the node itself (see live_detach_cni_del.yaml),
# since generic support-tools images were confirmed not to bundle it.
cudn_net_live_detach_helper_image: registry.redhat.io/rhel9/support-tools:latest
cudn_net_live_detach_helper_namespace: "{{ ovn_kubernetes_namespace }}"
cudn_net_live_detach_helper_wait_timeout_seconds: 60
cudn_net_live_detach_helper_wait_poll_interval_seconds: 2

# OVN NB port-security patching (temporary stopgap, see design.md "Port security" and
# patch_router_pod_port_security.yaml) -- where the OVN northbound DB lives and how to
# reach it via kubectl exec. Not verifiable in this repo's test environment (no live
# OVN-Kubernetes cluster); confirm against a real cluster before relying on these defaults.
ovn_kubernetes_namespace: openshift-ovn-kubernetes
ovnkube_node_pod_label: app=ovnkube-node
ovnkube_node_nbdb_container: nbdb
