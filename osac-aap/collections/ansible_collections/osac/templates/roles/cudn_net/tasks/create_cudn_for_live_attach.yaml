---
# Create the CUDN and wait for its NetworkAttachmentDefinition before changing the
# router Pod's Multus annotation. The caller patches the annotation immediately after
# this task returns, allowing the dynamic-networks controller to process one complete
# ADD request against an existing NAD.
#
# Why this order: the Multus dynamic-networks controller handles a Pod annotation update
# without recreating the Pod. Waiting for the NAD first ensures that update is processed
# as a single successful ADD, while the CUDN controller still creates the logical switch
# port and network attachment definition before the Pod requests the network.
#
# Patching the annotation before the NAD exists is unsafe: the dynamic-networks controller
# can queue a failed ADD and a corresponding DEL. Once the NAD appears it can execute the
# ADD and then the stale DEL, leaving network-status claiming an interface that no longer
# exists in the Pod network namespace. Waiting for the NAD avoids that race.
#
# This file is only ever included for the "attach" path (see add_router_pod_subnet.yaml);
# detach intentionally does not use this mechanism -- see delete_subnet.yaml.
#
# Computing router_pod_networks earlier in add_router_pod_subnet.yaml only sets a Jinja
# fact -- it does not itself touch the Pod object. The caller's normal live-attach patch
# and verification remain the single completion/fallback path after this task returns.

- name: Create ClusterUserDefinedNetwork for the subnet
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: ClusterUserDefinedNetwork
      metadata:
        name: "{{ subnet_name }}"
        labels: "{{ default_subnet_labels }}"
      spec:
        namespaceSelector:
          matchLabels: "{{ subnet_cudn_namespace_selector }}"
        network:
          topology: "Layer2"
          layer2:
            role: "{{ subnet_cudn_layer2_role }}"
            ipam:
              lifecycle: "{{ default_ipam_lifecycle }}"
            subnets: "{{ cudn_subnets }}"
  register: cudn_result

- name: Display CUDN creation result
  ansible.builtin.debug:
    msg:
      - "CUDN '{{ subnet_name }}' created successfully"
      - "Resource UID: {{ cudn_result.result.metadata.uid | default('N/A') }}"

- name: Wait for the subnet's NetworkAttachmentDefinition to be created
  # Best-effort: if the NAD is unusually slow to appear (or never does), do not fail the
  # whole job here -- let patch_router_pod_networks.yaml's existing live-attach timeout and
  # recreation fallback be the single source of truth for whether this Subnet operation
  # succeeds. When the NAD is ready, the caller's normal compact-JSON patch is the first
  # dynamic-network update for this attachment.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: k8s.cni.cncf.io/v1
    kind: NetworkAttachmentDefinition
    namespace: "{{ subnet_vn_name }}"
    name: "{{ subnet_name }}"
  register: subnet_nad_info
  until: subnet_nad_info.resources | length == 1
  retries: "{{ (cudn_net_router_nad_wait_timeout_seconds / cudn_net_router_nad_wait_poll_interval_seconds) | round(0, 'ceil') | int }}"
  delay: "{{ cudn_net_router_nad_wait_poll_interval_seconds }}"
  ignore_errors: true
