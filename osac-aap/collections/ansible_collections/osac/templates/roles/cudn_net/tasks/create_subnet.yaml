---
# Subnet role creates the network resources for a Subnet.
#
# For a Subnet on a Primary-type VirtualNetwork (the default): creates a dedicated
# Namespace (with required labels for OVN primary UDN) and a role:Primary CUDN targeting
# that namespace.
#
# For a Subnet on a Secondary-type VirtualNetwork: no dedicated namespace is created --
# the VirtualNetwork has one infrastructure namespace for its router Pod (from
# create_virtual_network.yaml). The router namespace is labeled for this subnet before
# its CUDN is created. A role:Secondary CUDN then selects the subnet-scoped label, which
# can also be mirrored onto VM namespaces that explicitly attach this subnet. The new
# subnet is attached to the running router Pod's Multus network list (see design.md's
# "Router pod gains an interface for the new subnet", AC3).
#
# For Secondary subnets, the CUDN itself is deliberately *not* created here -- it is
# created by add_router_pod_subnet.yaml, after the router Pod's Multus annotation already
# announces it. OVN-Kubernetes's per-network Pod controller only recomputes a Pod's network
# membership from scratch when its own controller starts up (i.e., when its CUDN is
# created), never on a plain Pod Update to an already-scheduled Pod. Creating the CUDN
# after the Pod already references it means that controller's own startup sync discovers
# the Pod immediately and creates the logical port without a restart; creating the CUDN
# first (the order used for Primary subnets, and Secondary's own order prior to this
# comment) leaves the live attach permanently unable to succeed for that Subnet, always
# falling back to Epic 1's recreation path. See add_router_pod_subnet.yaml and
# create_cudn_for_live_attach.yaml for the rest of this sequence.

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract Subnet configuration
  ansible.builtin.set_fact:
    subnet_name: "{{ subnet.metadata.name }}"
    subnet_namespace: "{{ subnet.metadata.namespace }}"
    subnet_id: "{{ subnet.metadata.labels['osac.openshift.io/subnet-uuid'] | default(subnet.metadata.name) }}"
    subnet_ipv4_cidr: "{{ subnet.spec.ipv4Cidr | default('') }}"
    subnet_ipv6_cidr: "{{ subnet.spec.ipv6Cidr | default('') }}"
    subnet_tenant_id: "{{ subnet.metadata.annotations['osac.openshift.io/tenant'] | default('') }}"
    subnet_virtual_network: "{{ subnet.spec.virtualNetwork | default('') }}"
    subnet_networking_type: "{{ subnet.metadata.annotations['osac.openshift.io/networking-type'] | default('Primary') }}"
    subnet_vn_name: "{{ subnet.metadata.annotations['osac.openshift.io/virtual-network-name'] | default('') }}"

- name: Build the subnet selector label key
  ansible.builtin.set_fact:
    subnet_selector_label_key: "secondary-subnet.osac.openshift.io/{{ subnet_id }}"

- name: Build CUDN subnets array
  ansible.builtin.set_fact:
    cudn_subnets: >-
      {{
        ((subnet_ipv4_cidr | length > 0) | ternary([subnet_ipv4_cidr], []))
        + ((subnet_ipv6_cidr | length > 0) | ternary([subnet_ipv6_cidr], []))
      }}

- name: Build namespace labels
  ansible.builtin.set_fact:
    # Note: k8s.ovn.org/primary-user-defined-network requires empty string value
    # Only filter out optional osac.io labels that are truly unset
    namespace_labels: >-
      {{
        default_subnet_labels | combine({
          'k8s.ovn.org/primary-user-defined-network': ''
        }) | combine(
          {'osac.openshift.io/subnet-id': subnet_id} if subnet_id else {}
        ) | combine(
          {'osac.openshift.io/tenant': subnet_tenant_id} if subnet_tenant_id else {}
        ) | combine(
          {'osac.openshift.io/virtual-network': subnet_virtual_network} if subnet_virtual_network else {}
        )
      }}

- name: Display Subnet information
  ansible.builtin.debug:
    msg:
      - "Creating Namespace and CUDN for Subnet '{{ subnet_name }}'"
      - "Subnet ID: {{ subnet_id }}"
      - "Tenant ID: {{ subnet_tenant_id }}"
      - "VirtualNetwork: {{ subnet_virtual_network }}"
      - "IPv4 CIDR: {{ subnet_ipv4_cidr | default('not configured') }}"
      - "IPv6 CIDR: {{ subnet_ipv6_cidr | default('not configured') }}"
      - "CUDN subnets: {{ cudn_subnets }}"
      - "Namespace labels: {{ namespace_labels }}"

- name: Create Namespace for Subnet
  when: subnet_networking_type != 'Secondary'
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ subnet_name }}"
        labels: "{{ namespace_labels }}"
  register: namespace_result

- name: Display Namespace creation result
  when: subnet_networking_type != 'Secondary'
  ansible.builtin.debug:
    msg:
      - "Namespace '{{ subnet_name }}' created/updated successfully"
      - "Changed: {{ namespace_result.changed | default(false) }}"

- name: Require the Secondary VirtualNetwork namespace before adding its subnet label
  when: subnet_networking_type == 'Secondary'
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Namespace
    name: "{{ subnet_vn_name }}"
  register: secondary_vn_namespace_info

- name: Assert the Secondary VirtualNetwork namespace exists
  when: subnet_networking_type == 'Secondary'
  ansible.builtin.assert:
    that:
      - secondary_vn_namespace_info.resources | length == 1
    fail_msg: >-
      Cannot add subnet selector label '{{ subnet_selector_label_key }}':
      Secondary VirtualNetwork namespace '{{ subnet_vn_name }}' does not exist.

- name: Add the subnet selector label to the router namespace
  when: subnet_networking_type == 'Secondary'
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Namespace
    name: "{{ subnet_vn_name }}"
    patch:
      - op: add
        path: "/metadata/labels/{{ subnet_selector_label_key | replace('/', '~1') }}"
        value: "true"

- name: Build CUDN namespaceSelector and layer2 role
  ansible.builtin.set_fact:
    # Secondary: match this subnet's own label. The router namespace receives this label
    # during subnet creation and ComputeInstance reconciliation mirrors it to VM namespaces
    # that attach this subnet. Transit intentionally uses the separate VN-scoped label.
    # Primary: unchanged, matches this subnet's own dedicated namespace.
    subnet_cudn_namespace_selector: >-
      {{
        {subnet_selector_label_key: 'true'}
        if subnet_networking_type == 'Secondary'
        else {'osac.openshift.io/subnet-id': subnet_id}
      }}
    subnet_cudn_layer2_role: "{{ 'Secondary' if subnet_networking_type == 'Secondary' else default_layer2_role }}"

- name: Create ClusterUserDefinedNetwork
  # Secondary subnets whose router Pod is managed (cudn_net_manage_router_pod, the
  # production default) create their CUDN later, in add_router_pod_subnet.yaml -- see the
  # note above this file's Primary/Secondary comment block. When router Pod management is
  # disabled (the CUDN-contract-only test path), there is no add_router_pod_subnet.yaml
  # call to create it, so it is still created here.
  when: subnet_networking_type != 'Secondary' or not (cudn_net_manage_router_pod | bool)
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: ClusterUserDefinedNetwork
      metadata:
        name: "{{ subnet_name }}"
        labels: "{{ default_subnet_labels }}"
      spec:
        namespaceSelector:
          matchLabels: "{{ subnet_cudn_namespace_selector }}"
        network:
          topology: "Layer2"
          layer2:
            role: "{{ subnet_cudn_layer2_role }}"
            ipam:
              lifecycle: "{{ default_ipam_lifecycle }}"
            subnets: "{{ cudn_subnets }}"
  register: cudn_result

- name: Display CUDN creation result
  when: subnet_networking_type != 'Secondary' or not (cudn_net_manage_router_pod | bool)
  ansible.builtin.debug:
    msg:
      - "CUDN '{{ subnet_name }}' created successfully"
      - "Resource UID: {{ cudn_result.result.metadata.uid | default('N/A') }}"

- name: Reserve the subnet's persistent gateway address and attach it to the router Pod
  when:
    - subnet_networking_type == 'Secondary'
    - cudn_net_manage_router_pod | bool
  ansible.builtin.include_tasks: reconcile_router_pod_subnet.yaml
  vars:
    router_pod_mutation_action: add
