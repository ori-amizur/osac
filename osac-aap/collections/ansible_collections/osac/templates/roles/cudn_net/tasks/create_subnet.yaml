---
# Subnet role creates the network resources for a Subnet.
#
# For a Subnet on a Primary-type VirtualNetwork (the default): creates a dedicated
# Namespace (with required labels for OVN primary UDN) and a role:Primary CUDN targeting
# that namespace.
#
# For a Subnet on a Secondary-type VirtualNetwork: no dedicated namespace is created --
# the VirtualNetwork already has one shared namespace (its router pod's namespace, from
# create_virtual_network.yaml). Instead, creates a role:Secondary CUDN whose
# namespaceSelector matches the same per-VN-UUID-keyed label the shared namespace already
# carries, and attaches the new subnet to the router pod Deployment's Multus network list
# (see design.md's "Router pod gains an interface for the new subnet", AC3).

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract Subnet configuration
  ansible.builtin.set_fact:
    subnet_name: "{{ subnet.metadata.name }}"
    subnet_namespace: "{{ subnet.metadata.namespace }}"
    subnet_id: "{{ subnet.metadata.labels['osac.openshift.io/subnet-uuid'] | default(subnet.metadata.name) }}"
    subnet_ipv4_cidr: "{{ subnet.spec.ipv4Cidr | default('') }}"
    subnet_ipv6_cidr: "{{ subnet.spec.ipv6Cidr | default('') }}"
    subnet_tenant_id: "{{ subnet.metadata.annotations['osac.openshift.io/tenant'] | default('') }}"
    subnet_virtual_network: "{{ subnet.spec.virtualNetwork | default('') }}"
    subnet_networking_type: "{{ subnet.metadata.annotations['osac.openshift.io/networking-type'] | default('Primary') }}"
    subnet_vn_name: "{{ subnet.metadata.annotations['osac.openshift.io/virtual-network-name'] | default('') }}"

- name: Build CUDN subnets array
  ansible.builtin.set_fact:
    cudn_subnets: >-
      {{
        ((subnet_ipv4_cidr | length > 0) | ternary([subnet_ipv4_cidr], []))
        + ((subnet_ipv6_cidr | length > 0) | ternary([subnet_ipv6_cidr], []))
      }}

- name: Build namespace labels
  ansible.builtin.set_fact:
    # Note: k8s.ovn.org/primary-user-defined-network requires empty string value
    # Only filter out optional osac.io labels that are truly unset
    namespace_labels: >-
      {{
        default_subnet_labels | combine({
          'k8s.ovn.org/primary-user-defined-network': ''
        }) | combine(
          {'osac.openshift.io/subnet-id': subnet_id} if subnet_id else {}
        ) | combine(
          {'osac.openshift.io/tenant': subnet_tenant_id} if subnet_tenant_id else {}
        ) | combine(
          {'osac.openshift.io/virtual-network': subnet_virtual_network} if subnet_virtual_network else {}
        )
      }}

- name: Display Subnet information
  ansible.builtin.debug:
    msg:
      - "Creating Namespace and CUDN for Subnet '{{ subnet_name }}'"
      - "Subnet ID: {{ subnet_id }}"
      - "Tenant ID: {{ subnet_tenant_id }}"
      - "VirtualNetwork: {{ subnet_virtual_network }}"
      - "IPv4 CIDR: {{ subnet_ipv4_cidr | default('not configured') }}"
      - "IPv6 CIDR: {{ subnet_ipv6_cidr | default('not configured') }}"
      - "CUDN subnets: {{ cudn_subnets }}"
      - "Namespace labels: {{ namespace_labels }}"

- name: Create Namespace for Subnet
  when: subnet_networking_type != 'Secondary'
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ subnet_name }}"
        labels: "{{ namespace_labels }}"
  register: namespace_result

- name: Display Namespace creation result
  when: subnet_networking_type != 'Secondary'
  ansible.builtin.debug:
    msg:
      - "Namespace '{{ subnet_name }}' created/updated successfully"
      - "Changed: {{ namespace_result.changed | default(false) }}"

- name: Build CUDN namespaceSelector and layer2 role
  ansible.builtin.set_fact:
    # Secondary: match the per-VN-UUID-keyed label the VirtualNetwork's shared namespace
    # already carries (create_virtual_network.yaml) rather than a fixed namespace name.
    # Primary: unchanged, matches this subnet's own dedicated namespace.
    subnet_cudn_namespace_selector: >-
      {{
        {'secondary-vn.osac.openshift.io/' ~ subnet_virtual_network: 'true'}
        if subnet_networking_type == 'Secondary'
        else {'osac.openshift.io/subnet-id': subnet_id}
      }}
    subnet_cudn_layer2_role: "{{ 'Secondary' if subnet_networking_type == 'Secondary' else default_layer2_role }}"

- name: Create ClusterUserDefinedNetwork
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: ClusterUserDefinedNetwork
      metadata:
        name: "{{ subnet_name }}"
        labels: "{{ default_subnet_labels }}"
      spec:
        namespaceSelector:
          matchLabels: "{{ subnet_cudn_namespace_selector }}"
        network:
          topology: "Layer2"
          layer2:
            role: "{{ subnet_cudn_layer2_role }}"
            ipamLifecycle: "{{ default_ipam_lifecycle }}"
            subnets: "{{ cudn_subnets }}"
  register: cudn_result

- name: Display CUDN creation result
  ansible.builtin.debug:
    msg:
      - "CUDN '{{ subnet_name }}' created successfully"
      - "Resource UID: {{ cudn_result.result.metadata.uid | default('N/A') }}"

- name: Attach the new subnet to the router pod Deployment
  when: subnet_networking_type == 'Secondary'
  block:
    - name: Get the router pod Deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ subnet_vn_name }}"
        name: "{{ router_pod_name }}"
      register: router_pod_deployment_info

    - name: Compute updated router pod Multus network attachment list
      ansible.builtin.set_fact:
        router_pod_networks: >-
          {{
            (
              (router_pod_deployment_info.resources[0].spec.template.metadata.annotations | default({}))
                .get('k8s.v1.cni.cncf.io/networks', '')
                .split(',') | reject('equalto', '') | list
            ) | union([subnet_name])
          }}

    - name: Patch router pod Deployment to attach the new subnet
      kubernetes.core.k8s_json_patch:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ subnet_vn_name }}"
        name: "{{ router_pod_name }}"
        patch:
          - op: add
            path: /spec/template/metadata/annotations
            value:
              k8s.v1.cni.cncf.io/networks: "{{ router_pod_networks | join(',') }}"

    - name: Display router pod attachment result
      ansible.builtin.debug:
        msg: "Router pod Deployment '{{ router_pod_name }}' now attached to: {{ router_pod_networks | join(', ') }}"
