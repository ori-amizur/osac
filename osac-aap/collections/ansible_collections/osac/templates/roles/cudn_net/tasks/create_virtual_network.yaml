---
# For networkingType: Primary (the default), VirtualNetwork is a logical grouping -
# actual network provisioning happens in Subnet, and this task file only logs
# information and returns success.
#
# For networkingType: Secondary, this provisions the router-pod foundation: one
# namespace and one router pod Deployment per VirtualNetwork (see design.md's
# "Router pod and namespace provisioning for Secondary VirtualNetworks"). The
# Deployment's container starts with the cluster-network interface and a projected
# ConfigMap containing the initial empty router configuration. Subnet tasks update
# that ConfigMap as gateway claims are created.

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract VirtualNetwork configuration
  ansible.builtin.set_fact:
    vn_name: "{{ virtual_network.metadata.name }}"
    vn_namespace: "{{ virtual_network.metadata.namespace }}"
    vn_ipv4_cidr: "{{ virtual_network.spec.ipv4Cidr | default('') }}"
    vn_ipv6_cidr: "{{ virtual_network.spec.ipv6Cidr | default('') }}"
    vn_network_class: "{{ virtual_network.spec.networkClass }}"
    vn_region: "{{ virtual_network.spec.region }}"
    vn_tenant_id: "{{ virtual_network.metadata.annotations['osac.openshift.io/tenant'] | default('') }}"
    vn_networking_type: "{{ virtual_network.spec.networkingType | default('Primary') }}"
    vn_uuid: "{{ virtual_network.metadata.labels['osac.openshift.io/virtualnetwork-uuid'] }}"
    vn_fabric_manager_configured: >-
      {{ virtual_network.metadata.annotations['osac.openshift.io/fabric-manager-configured'] | default('false') | lower }}
    vn_transit_capability: >-
      {{ virtual_network.metadata.annotations['osac.openshift.io/transit-capability'] | default('none', true) | lower }}

- name: Display VirtualNetwork information
  ansible.builtin.debug:
    msg:
      - "VirtualNetwork '{{ vn_name }}' processed successfully"
      - "Namespace: {{ vn_namespace }}"
      - "NetworkClass: {{ vn_network_class }}"
      - "Networking type: {{ vn_networking_type }}"
      - "Region: {{ vn_region }}"
      - "Tenant ID: {{ vn_tenant_id }}"
      - "Fabric manager configured: {{ vn_fabric_manager_configured }}"
      - "Transit capability: {{ vn_transit_capability }}"
      - "IPv4 CIDR: {{ vn_ipv4_cidr | default('not configured') }}"
      - "IPv6 CIDR: {{ vn_ipv6_cidr | default('not configured') }}"
      - ""
      - "NOTE: for networkingType Primary, VirtualNetwork is a logical grouping"
      - "Actual network provisioning happens when Subnet resources are created"

- name: Provision router pod namespace and Deployment for Secondary VirtualNetworks
  when: vn_networking_type == 'Secondary'
  block:
    - name: Build router pod namespace labels
      ansible.builtin.set_fact:
        # secondary-vn.osac.openshift.io/<vn-uuid> is a per-VN-keyed label, not a single
        # osac.openshift.io/virtual-network key with the VN as its value: a namespace must
        # be able to carry this label for more than one Secondary VN at once (e.g. a
        # dual-attached VM's own namespace, associated with its Primary VN *and*
        # dual-attached into one or more Secondary VNs) without the values colliding on a
        # shared key. Subnet's CUDN namespaceSelector (create_subnet.yaml) matches on this
        # same key, keyed by subnet.spec.virtualNetwork (the same UUID).
        router_pod_namespace_labels: >-
          {{
            default_subnet_labels | combine(
              {'osac.openshift.io/tenant': vn_tenant_id} if vn_tenant_id else {}
            ) | combine(
              {'secondary-vn.osac.openshift.io/' ~ vn_uuid: 'true'}
            ) | combine(
              {'osac.openshift.io/evpn-transit': 'true'}
              if vn_transit_capability == 'netris-evpn' else {}
            ) | combine(
              {'k8s.ovn.org/primary-user-defined-network': ''}
              if vn_transit_capability == 'netris-evpn' else {}
            )
          }}

    - name: Create Namespace for the router pod
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ vn_name }}"
            labels: "{{ router_pod_namespace_labels }}"
            annotations:
              osac.openshift.io/tenant: "{{ vn_tenant_id }}"
              osac.openshift.io/owner-reference: "{{ vn_uuid }}"
      register: router_pod_namespace_result

    - name: Provision the VN-scoped EVPN transit interface
      ansible.builtin.include_tasks: ensure_evpn_transit.yaml
      when: vn_transit_capability == 'netris-evpn'

    - name: Create router pod ServiceAccount
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ router_pod_service_account_name }}"
            namespace: "{{ vn_name }}"
            labels: "{{ default_subnet_labels }}"
            annotations:
              osac.openshift.io/tenant: "{{ vn_tenant_id }}"
              osac.openshift.io/owner-reference: "{{ vn_uuid }}"

    - name: Bind router pod ServiceAccount to the router pod SCC
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ router_pod_service_account_name }}-scc-{{ vn_name }}"
            labels: "{{ default_subnet_labels }}"
            annotations:
              osac.openshift.io/tenant: "{{ vn_tenant_id }}"
              osac.openshift.io/owner-reference: "{{ vn_uuid }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ router_pod_scc_cluster_role }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ router_pod_service_account_name }}"
              namespace: "{{ vn_name }}"

    - name: Initialize router agent configuration
      ansible.builtin.include_tasks: write_router_config.yaml
      vars:
        router_pod_config_namespace: "{{ vn_name }}"
        router_pod_config_tenant: "{{ vn_tenant_id }}"
        router_pod_config_owner_reference: "{{ vn_uuid }}"
        router_pod_config_version: "0"
        router_pod_config_networks: []
        router_pod_config_gateway_ips: []
        router_pod_config_routes: []

    - name: Create router pod Deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ router_pod_name }}"
            namespace: "{{ vn_name }}"
            labels: "{{ default_subnet_labels | combine({'osac.openshift.io/router-pod': 'true'}) }}"
            annotations:
              osac.openshift.io/tenant: "{{ vn_tenant_id }}"
              osac.openshift.io/owner-reference: "{{ vn_uuid }}"
          spec:
            replicas: 1
            # The transit IPAMClaim is persistent and OVN reserves its MAC for
            # one router Pod at a time. A fallback recreation must therefore
            # terminate the old Pod before creating the replacement; the
            # default RollingUpdate strategy causes a MAC collision.
            strategy:
              type: Recreate
            selector:
              matchLabels:
                osac.openshift.io/router-pod: "true"
                osac.openshift.io/virtual-network: "{{ vn_name }}"
            template:
              metadata:
                labels:
                  osac.openshift.io/router-pod: "true"
                  osac.openshift.io/virtual-network: "{{ vn_name }}"
                annotations: >-
                  {{
                    {
                      'k8s.ovn.org/primary-udn-ipamclaim': cudn_net_evpn_transit_ipam_claim_name
                    }
                    if router_pod_transit_enabled | default(false) | bool else {}
                  }}
              spec:
                serviceAccountName: "{{ router_pod_service_account_name }}"
                # net.ipv4.ip_forward must be set here, not by the agent: /proc/sys
                # is mounted read-only regardless of capabilities, confirmed by direct
                # testing -- `sysctl -w` from inside the container fails with "permission
                # denied" even with NET_ADMIN. This is Kubernetes' safe/namespaced-sysctls
                # mechanism, applied by the container runtime before the container starts.
                securityContext:
                  sysctls:
                    - name: net.ipv4.ip_forward
                      value: "1"
                containers:
                  - name: router
                    image: "{{ router_pod_image }}"
                    imagePullPolicy: Always
                    env:
                      - name: ROUTER_POD_CLUSTER_NET_IP
                        valueFrom:
                          fieldRef:
                            fieldPath: status.podIP
                      - name: ROUTER_POD_STATUS_FILE
                        value: "{{ router_pod_status_file }}"
                      - name: ROUTER_POD_CONFIG_FILE
                        value: "{{ router_pod_config_file }}"
                    volumeMounts:
                      - name: router-agent-config
                        mountPath: "{{ router_pod_config_file | dirname }}"
                        readOnly: true
                      - name: router-agent-status
                        mountPath: "{{ router_pod_status_file | dirname }}"
                    # No command override: osac-router-agent runs the forwarding/SNAT
                    # and ConfigMap-driven netlink setup.
                    # NET_ADMIN for the agent's nft SNAT and netlink operations.
                    # Requires the router pod ServiceAccount above to be bound to a SCC
                    # allowing it (see osac-installer's router-pod-scc.yaml) -- on a
                    # cluster without that SCC bound, this Deployment's pods will fail
                    # admission.
                    securityContext:
                      capabilities:
                        drop:
                          - ALL
                        add:
                          - NET_ADMIN
                volumes:
                  - name: router-agent-config
                    configMap:
                      name: "{{ router_pod_config_map_name }}"
                  - name: router-agent-status
                    emptyDir: {}
      register: router_pod_deployment_result

    - name: Display router pod provisioning result
      ansible.builtin.debug:
        msg:
          - "Namespace '{{ vn_name }}' created/updated: {{ router_pod_namespace_result.changed | default(false) }}"
          - "Router pod Deployment '{{ router_pod_name }}' created/updated: {{ router_pod_deployment_result.changed | default(false) }}"

    - name: Patch OVN port security for the EVPN transit interface
      ansible.builtin.include_tasks: patch_router_pod_port_security.yaml
      vars:
        subnet_vn_name: "{{ vn_name }}"
        router_pod_networks:
          - "{{ router_pod_transit_attachment }}"
      when:
        - router_pod_transit_enabled | default(false) | bool
        - cudn_net_evpn_transit_patch_port_security | bool
