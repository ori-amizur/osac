---
# Delete a Subnet's network resources.
#
# For a Primary-type VirtualNetwork's Subnet (the default): deletes the CUDN first (must
# be removed before namespace), then the Subnet's own dedicated Namespace.
#
# For a Secondary-type VirtualNetwork's Subnet: reconcile_router_pod_subnet.yaml (remove)
# owns the entire sequence -- issuing the CUDN delete, the live detach itself (or
# recreation fallback), and force-clearing the CUDN/NAD finalizers once confirmed safe --
# all under the same per-VirtualNetwork Lease. See remove_router_pod_subnet.yaml and
# check_subnet_still_referenced.yaml for why the CUDN delete must be issued before, not
# after, the live detach, and why the finalizer force-clear must exclude the router Pod's
# own permanently-stale k8s.ovn.org/pod-networks entry. There is no per-subnet namespace
# to delete for Secondary subnets.
#
# Handles "not found" errors gracefully for both resources.

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract Subnet configuration
  ansible.builtin.set_fact:
    subnet_name: "{{ subnet.metadata.name }}"
    subnet_id: "{{ subnet.metadata.labels['osac.openshift.io/subnet-uuid'] | default(subnet.metadata.name) }}"
    subnet_tenant_id: "{{ subnet.metadata.annotations['osac.openshift.io/tenant'] | default('') }}"
    subnet_networking_type: "{{ subnet.metadata.annotations['osac.openshift.io/networking-type'] | default('Primary') }}"
    subnet_vn_name: "{{ subnet.metadata.annotations['osac.openshift.io/virtual-network-name'] | default('') }}"
    subnet_virtual_network: "{{ subnet.spec.virtualNetwork | default('') }}"

- name: Build the subnet selector label key
  ansible.builtin.set_fact:
    subnet_selector_label_key: "secondary-subnet.osac.openshift.io/{{ subnet_id }}"

- name: Display deletion information
  ansible.builtin.debug:
    msg:
      - "Deleting CUDN for Subnet '{{ subnet_name }}'"
      - "Subnet ID: {{ subnet_id }}"
      - "Networking type: {{ subnet_networking_type }}"

- name: Detach the Secondary Subnet before deleting its network resources
  when:
    - subnet_networking_type == 'Secondary'
    - cudn_net_manage_router_pod | bool
  ansible.builtin.include_tasks: reconcile_router_pod_subnet.yaml
  vars:
    router_pod_mutation_action: remove

- name: Delete ClusterUserDefinedNetwork
  # Secondary subnets: remove_router_pod_subnet.yaml (called above, under the per-
  # VirtualNetwork Lease) already issued this delete before checking references, and
  # force-clears the finalizer itself once confirmed safe. Issuing it again here would
  # race that sequence outside the Lease that protects it.
  when: subnet_networking_type != 'Secondary' or not (cudn_net_manage_router_pod | bool)
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ subnet_name }}"
    wait: true
    wait_timeout: 300
  register: cudn_delete_result
  failed_when:
    - cudn_delete_result.failed | default(false)
    - "'NotFound' not in (cudn_delete_result.msg | default(''))"

- name: Display CUDN deletion result
  when: subnet_networking_type != 'Secondary' or not (cudn_net_manage_router_pod | bool)
  ansible.builtin.debug:
    msg:
      - "CUDN '{{ subnet_name }}' deletion completed"
      - "Changed: {{ cudn_delete_result.changed | default(false) }}"

- name: Read the Secondary VirtualNetwork namespace before removing its subnet label
  when:
    - subnet_networking_type == 'Secondary'
    - not (subnet_still_referenced | default(false))
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Namespace
    name: "{{ subnet_vn_name }}"
  register: secondary_vn_namespace_info

- name: Remove the subnet selector label from the router namespace
  when:
    - subnet_networking_type == 'Secondary'
    - not (subnet_still_referenced | default(false))
    - secondary_vn_namespace_info.resources | length == 1
    - subnet_selector_label_key in (secondary_vn_namespace_info.resources[0].metadata.labels | default({}))
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Namespace
    name: "{{ subnet_vn_name }}"
    patch:
      - op: remove
        path: "/metadata/labels/{{ subnet_selector_label_key | replace('/', '~1') }}"

- name: Delete Namespace
  when: subnet_networking_type != 'Secondary'
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ subnet_name }}"
    wait: true
    wait_timeout: 300
  register: namespace_delete_result
  failed_when:
    - namespace_delete_result.failed | default(false)
    - "'NotFound' not in (namespace_delete_result.msg | default(''))"

- name: Display Namespace deletion result
  when: subnet_networking_type != 'Secondary'
  ansible.builtin.debug:
    msg:
      - "Namespace '{{ subnet_name }}' deletion completed"
      - "Changed: {{ namespace_delete_result.changed | default(false) }}"
