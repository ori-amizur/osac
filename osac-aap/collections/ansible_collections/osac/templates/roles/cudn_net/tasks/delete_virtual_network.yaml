---
# For networkingType: Primary (the default), VirtualNetwork deletion is a stub -
# no resources were created during provisioning (see create_virtual_network.yaml).
#
# For networkingType: Secondary, deletes the VirtualNetwork's namespace, which
# cascades and removes the router pod Deployment/Pod with it.

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract VirtualNetwork name and networking type
  ansible.builtin.set_fact:
    vn_name: "{{ virtual_network.metadata.name }}"
    vn_networking_type: "{{ virtual_network.spec.networkingType | default('Primary') }}"

- name: Delete router pod namespace for Secondary VirtualNetworks
  when: vn_networking_type == 'Secondary'
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vn_name }}"

- name: Display deletion status (Secondary)
  when: vn_networking_type == 'Secondary'
  ansible.builtin.debug:
    msg: "VirtualNetwork '{{ vn_name }}' router pod namespace deleted"

- name: Display deletion status (Primary)
  when: vn_networking_type != 'Secondary'
  ansible.builtin.debug:
    msg:
      - "VirtualNetwork '{{ vn_name }}' deletion completed"
      - "NOTE: No resources were created during VirtualNetwork provisioning"
      - "Subnet resources (if any) must be deleted separately"
