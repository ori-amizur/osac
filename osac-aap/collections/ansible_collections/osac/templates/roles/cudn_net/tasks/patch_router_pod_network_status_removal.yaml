---
# After a successful direct CNI DEL (live_detach_cni_del.yaml), the router Pod's
# k8s.v1.cni.cncf.io/network-status annotation is never updated automatically --
# nothing else runs the removal for us, since it was bypassed entirely. Unlike the
# attach path (where verify_router_pod_networks.yaml can wait for
# multus-dynamic-networks-controller to report success), there is nothing to wait for
# here: the interface is already confirmed gone, so this patches network-status
# directly instead of polling for something that will never change on its own.

- name: Get the running router Pod for the network-status patch
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ subnet_vn_name }}"
    label_selectors:
      - "osac.openshift.io/router-pod=true"
      - "osac.openshift.io/virtual-network={{ subnet_vn_name }}"
  register: network_status_removal_pod_info

- name: Compute network-status with the subnet's entry removed
  ansible.builtin.set_fact:
    network_status_removal_value: >-
      {{
        (
          (network_status_removal_pod_info.resources[0].metadata.annotations | default({}))
            .get('k8s.v1.cni.cncf.io/network-status', '[]') | from_json
        )
        | rejectattr('name', 'equalto', subnet_vn_name ~ '/' ~ subnet_name)
        | rejectattr('name', 'equalto', subnet_name)
        | list
        | to_json
      }}

- name: Patch the router Pod network-status metadata annotation
  when: (network_status_removal_pod_info.resources[0].metadata.annotations | default({})) | length > 0
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ subnet_vn_name }}"
    name: "{{ network_status_removal_pod_info.resources[0].metadata.name }}"
    patch:
      - op: add
        path: /metadata/annotations/k8s.v1.cni.cncf.io~1network-status
        value: "{{ network_status_removal_value }}"

- name: Add the router Pod network-status annotation map when absent
  when: (network_status_removal_pod_info.resources[0].metadata.annotations | default({})) | length == 0
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ subnet_vn_name }}"
    name: "{{ network_status_removal_pod_info.resources[0].metadata.name }}"
    patch:
      - op: add
        path: /metadata/annotations
        value:
          k8s.v1.cni.cncf.io/network-status: "{{ network_status_removal_value }}"
