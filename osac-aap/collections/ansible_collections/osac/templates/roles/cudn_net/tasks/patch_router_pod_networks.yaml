---
# Attach or detach the desired Secondary UDN set on the running router Pod.
#
# The live mutation and its network-status verification are one transaction. If
# either the annotation patch or verification fails, the rescue path changes the
# Deployment template and waits for a recreated Pod with the complete desired
# attachment set.

- name: Set router Pod mutation defaults
  ansible.builtin.set_fact:
    router_pod_attachment_action: "{{ router_pod_attachment_action | default('attach') }}"
    router_pod_live_attach_network_name: "{{ router_pod_live_attach_network_name | default(subnet_name) }}"

- name: Attempt live router Pod mutation
  block:
    - name: Patch the running router Pod annotation
      ansible.builtin.include_tasks: live_patch_router_pod_networks.yaml

    - name: Verify the live router Pod mutation
      ansible.builtin.include_tasks: verify_router_pod_networks.yaml
  rescue:
    - name: Report live router Pod mutation failure
      ansible.builtin.debug:
        msg: >-
          Router Pod '{{ router_pod_live_attach_name | default(router_pod_name) }}'
          did not complete the {{ router_pod_attachment_action }} operation for
          '{{ router_pod_live_attach_network_name }}' within
          {{ cudn_net_router_live_attach_timeout_seconds }} seconds or the live
          patch failed; falling back to Deployment-driven recreation.

    - name: Recreate the router Pod with the complete desired attachment set
      ansible.builtin.include_tasks: recreate_router_pod_networks.yaml
