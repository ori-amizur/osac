---
# Remove one Secondary Subnet while the per-VirtualNetwork router mutex is held.

- name: Get the current router Pod
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ subnet_vn_name }}"
    label_selectors:
      - "osac.openshift.io/router-pod=true"
      - "osac.openshift.io/virtual-network={{ subnet_vn_name }}"
  register: router_pod_info

- name: Get the router Pod Deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ subnet_vn_name }}"
    name: "{{ router_pod_name }}"
  register: router_pod_deployment_info

- name: Select a non-terminating running router Pod, if one exists
  ansible.builtin.set_fact:
    router_pod_running_list: >-
      {{
        router_pod_info.resources
        | selectattr('status.phase', 'equalto', 'Running')
        | rejectattr('metadata.deletionTimestamp', 'defined')
        | list
      }}

- name: Require an unambiguous current router Pod
  ansible.builtin.assert:
    that:
      - router_pod_running_list | length <= 1
    fail_msg: >-
      Found {{ router_pod_running_list | length }} non-terminating running router Pods in
      {{ subnet_vn_name }}; refusing to compute a removal from an ambiguous snapshot.

- name: Compute the complete desired router Pod attachment list from the latest state
  ansible.builtin.set_fact:
    router_pod_networks: >-
      {{
        (
          (
            router_pod_running_list[0].metadata.annotations | default({})
          ).get('k8s.v1.cni.cncf.io/networks', '[]') | from_json
          if router_pod_running_list | length > 0
          else (
            (
              router_pod_deployment_info.resources[0].spec.template.metadata.annotations
              | default({})
            ).get('k8s.v1.cni.cncf.io/networks', '[]') | from_json
            if router_pod_deployment_info.resources | length > 0
            else []
          )
        ) | rejectattr('name', 'equalto', subnet_name) | list
      }}

- name: Get the remaining router gateway IPAMClaims
  kubernetes.core.k8s_info:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    api_version: k8s.cni.cncf.io/v1alpha1
    kind: IPAMClaim
    namespace: "{{ subnet_vn_name }}"
    label_selectors:
      - "osac.openshift.io/managed-by=osac-fulfillment"
  register: router_gateway_claims_info

- name: Build the remaining router agent gateway configuration
  ansible.builtin.set_fact:
    router_pod_config_gateway_ips: []

- name: Build the remaining router agent gateway configuration
  ansible.builtin.set_fact:
    router_pod_config_gateway_ips: >-
      {{ router_pod_config_gateway_ips | default([]) + [{
        'interface': item.metadata.name,
        'address': item.status.ips[0]
      }] }}
  loop: "{{ router_gateway_claims_info.resources | default([]) }}"
  when:
    - item.metadata.name in (router_pod_networks | default([]) | map(attribute='name') | list)
    - item.metadata.name != subnet_name
    - item.status is defined
    - item.status.ips is defined
    - item.status.ips | length > 0

- name: Update router agent configuration after subnet removal
  ansible.builtin.include_tasks: write_router_config.yaml
  vars:
    router_pod_config_namespace: "{{ subnet_vn_name }}"
    router_pod_config_tenant: "{{ subnet_tenant_id }}"
    router_pod_config_owner_reference: "{{ subnet_virtual_network }}"
    router_pod_config_version: "{{ router_pod_networks | default([]) | to_json }}"
    router_pod_config_networks: "{{ router_pod_networks | default([]) }}"
    router_pod_config_include_fabric_routes: true
    router_pod_config_exclude_current_subnet: true
  when: router_pod_deployment_info.resources | length > 0

- name: Issue a normal delete on the ClusterUserDefinedNetwork before checking references
  # Safe to do first, unconditionally: a blocked delete (finalizer present) causes no
  # disruption to an already-stable interface -- confirmed directly against a real
  # cluster this session. This also mirrors ordinary Kubernetes finalizer semantics: the
  # CUDN correctly shows Terminating from here on if it turns out something else still
  # needs it (see check_subnet_still_referenced.yaml below).
  when: router_pod_deployment_info.resources | length > 0
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ subnet_name }}"
    wait: false
  failed_when: false

- name: Check whether the subnet is still referenced before attempting a live detach
  ansible.builtin.include_tasks: check_subnet_still_referenced.yaml
  when: router_pod_deployment_info.resources | length > 0

- name: Detach the subnet and reclaim its network resources
  when:
    - router_pod_deployment_info.resources | length > 0
    - not (subnet_still_referenced | default(false))
  block:
    - name: Perform the direct CNI DEL for the subnet's interface
      ansible.builtin.include_tasks: live_detach_cni_del.yaml

    - name: Patch the router Pod's Multus networks annotation to drop the subnet
      ansible.builtin.include_tasks: live_patch_router_pod_networks.yaml
      vars:
        router_pod_attachment_action: detach
        router_pod_live_attach_network_name: "{{ subnet_name }}"

    - name: Patch the router Pod's network-status to drop the subnet
      ansible.builtin.include_tasks: patch_router_pod_network_status_removal.yaml

    - name: Mark the router Pod operation as live
      ansible.builtin.set_fact:
        router_pod_attachment_mode: live

    - name: Record the successful live detach on the router Pod
      ansible.builtin.include_tasks: mark_router_pod_attachment_mode.yaml
      vars:
        router_pod_status_name: "{{ live_detach_router_pod_name }}"
        router_pod_live_attach_network_name: "{{ subnet_name }}"
  rescue:
    - name: Report live detach failure
      ansible.builtin.debug:
        msg: >-
          Live detach of '{{ subnet_name }}' from the router Pod failed; falling back to
          Deployment-driven recreation.

    - name: Recreate the router Pod with the complete desired attachment set
      ansible.builtin.include_tasks: recreate_router_pod_networks.yaml
      vars:
        router_pod_live_attach_network_name: "{{ subnet_name }}"
  always:
    - name: Re-check whether the subnet is still referenced before reclaiming it
      ansible.builtin.include_tasks: check_subnet_still_referenced.yaml
      when: router_pod_deployment_info.resources | length > 0

    - name: Force-clear the CUDN and NAD finalizers now that the detach is confirmed
      when:
        - router_pod_deployment_info.resources | length > 0
        - not (subnet_still_referenced | default(false))
      block:
        - name: Force-clear the ClusterUserDefinedNetwork finalizer
          kubernetes.core.k8s_json_patch:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            api_version: k8s.ovn.org/v1
            kind: ClusterUserDefinedNetwork
            name: "{{ subnet_name }}"
            patch:
              - op: replace
                path: /metadata/finalizers
                value: []
          failed_when: false

        - name: Force-clear the NetworkAttachmentDefinition finalizer
          kubernetes.core.k8s_json_patch:
            kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
            api_version: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            namespace: "{{ subnet_vn_name }}"
            name: "{{ subnet_name }}"
            patch:
              - op: replace
                path: /metadata/finalizers
                value: []
          failed_when: false

- name: Release the subnet's persistent gateway address
  when: not (subnet_still_referenced | default(false))
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: k8s.cni.cncf.io/v1alpha1
    kind: IPAMClaim
    namespace: "{{ subnet_vn_name }}"
    name: "{{ subnet_name }}"

- name: Patch OVN port security for the remaining subnet attachments
  ansible.builtin.include_tasks: patch_router_pod_port_security.yaml
  when:
    - (router_pod_networks | default([])) | length > 0
    - not (subnet_still_referenced | default(false))
