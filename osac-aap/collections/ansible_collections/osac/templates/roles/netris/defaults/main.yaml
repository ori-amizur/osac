---
default_vnet_vlan_id: auto
default_ipam_purpose_public: nat

# The shared EVPN transit V-Net is infrastructure-owned. Netris allocates its
# VNI; the role publishes the resulting attachment data for the k8s manager.
# The values are deployment configuration, not tenant input.
netris_evpn_transit_vnet_name: "{{ lookup('env', 'NETRIS_EVPN_TRANSIT_VNET_NAME') | default('', true) }}"
netris_evpn_transit_ipam_subnet_name: "{{ lookup('env', 'NETRIS_EVPN_TRANSIT_IPAM_SUBNET_NAME') | default(netris_evpn_transit_vnet_name, true) }}"
netris_evpn_transit_vtep_name: "{{ lookup('env', 'OSAC_EVPN_VTEP_NAME') | default('tenant-vtep', true) }}"
netris_evpn_transit_configmap_name: osac-evpn-transit
netris_evpn_transit_reserved_subnets: >-
  {{ lookup('env', 'NETRIS_EVPN_TRANSIT_RESERVED_SUBNETS') | default('[]', true) | from_json }}
