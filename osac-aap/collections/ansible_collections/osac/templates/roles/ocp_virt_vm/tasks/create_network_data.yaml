---
# For a VM whose primary (single-attachment scope: sole) subnet is Secondary-type:
# 1. Replaces the VM's default pod-network interface (create_build_spec.yaml's
#    `networks: [{name: default, pod: {}}]`) with an explicit Multus attachment to the
#    subnet's CUDN-generated NetworkAttachmentDefinition. This is necessary, not
#    cosmetic: `pod: {}` only gets transparently intercepted by OVN-Kubernetes for a
#    role:Primary UDN matching the namespace -- a role:Secondary UDN (what every
#    Secondary VN subnet's CUDN uses) never becomes a namespace's default network, so
#    without this the VM would attach to the cluster's own default network instead of
#    the subnet's Layer2 network.
# 2. Computes vm_network_data: cloud-init network-config content (route to the subnet's
#    .1 gateway plus DNS resolver config) for that same interface, per design.md's
#    cloud-init route/DNS injection requirements (Story 1.04).
# Both are no-ops (empty vm_network_data, networks/interfaces untouched) for a
# Primary-type subnet, or when the referenced Subnet can't be found.
#
# Single-attachment (Secondary-VN-only) scope only: this looks at networkAttachments[0]
# alone (vm_subnet_ref, already resolved by create_validate.yaml) -- dual-attached VMs (a
# Primary UDN elsewhere plus a Secondary VN subnet) need a second, additional interface
# and VN-CIDR-scoped routing instead of replacing the VM's sole interface, and are out of
# scope here (blocked on the same deferred multi-NIC-VM support as Story 1.03's AC2).
#
# Interface device is `bridge: {}`, not create_build_spec.yaml's `binding: {name:
# l2bridge}` -- verified (OpenShift Virtualization docs/Red Hat Developer articles):
# l2bridge is specific to the pod:{}/Primary-UDN case (it's what lets OVN-K
# transparently intercept the pod's default network); a Secondary UDN/CUDN attached via
# an explicit `multus: {networkName: ...}` network uses the `bridge: {}` interface
# device instead, whether backed by a plain NAD or a CUDN. Caveat: the concrete
# documented example found was for Localnet-topology secondary CUDNs specifically, not
# Layer2 (what this design uses) -- no Layer2-specific secondary-attachment example was
# found, so `bridge: {}` here is the correctly-generalized pattern, not a directly
# confirmed one for this exact topology/role combination.

- name: Initialize vm_network_data (no injection by default)
  ansible.builtin.set_fact:
    vm_network_data: ""

- name: Look up the ComputeInstance's primary subnet
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    name: "{{ vm_subnet_ref }}"
    namespace: "{{ compute_instance.metadata.namespace }}"
  register: vm_primary_subnet_info

- name: Build cloud-init network-config for a Secondary-VN-only VM
  when:
    - vm_primary_subnet_info.resources | length > 0
    - (vm_primary_subnet_info.resources[0].metadata.annotations | default({})).get('osac.openshift.io/networking-type', 'Primary') == 'Secondary'
  block:
    - name: Compute the subnet's gateway address
      ansible.builtin.set_fact:
        vm_subnet_gateway: >-
          {{
            (vm_primary_subnet_info.resources[0].spec.ipv4Cidr | ansible.netcommon.ipaddr('1')).split('/')[0]
          }}

    - name: Replace the VM's default pod-network interface with the subnet's NAD
      ansible.builtin.set_fact:
        vm_template_spec: "{{ vm_template_spec | combine(secondary_subnet_network_patch, recursive=True, list_merge='replace') }}"
      vars:
        # Bare name, not namespace-qualified: a ClusterUserDefinedNetwork creates a real
        # NAD in *every* namespace its namespaceSelector matches, so the NAD this
        # references is always local to whichever namespace the VM actually lives in --
        # the router pod's shared namespace here (single-attachment scope), or (once
        # built) a dual-attached VM's own foreign namespace via the shared-label
        # mechanism. Cross-namespace referencing is never needed by this design.
        secondary_subnet_network_patch:
          networks:
            - name: default
              multus:
                networkName: "{{ vm_subnet_ref }}"
          domain:
            devices:
              interfaces:
                - name: default
                  bridge: {}

    - name: Look up the cluster DNS Service ClusterIP
      kubernetes.core.k8s_info:
        kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
        api_version: v1
        kind: Service
        name: "{{ cluster_dns_service_name }}"
        namespace: "{{ cluster_dns_service_namespace }}"
      register: vm_cluster_dns_info

    - name: Build cloud-init network-config content
      when: vm_cluster_dns_info.resources | length > 0
      ansible.builtin.set_fact:
        # eth0: KubeVirt's own interface name in create_build_spec.yaml is "default", not
        # a guest-visible name -- eth0 is the common guest-side name for a KubeVirt
        # virtio-bound interface on typical cloud images (predictable-naming disabled),
        # but this is an assumption, not confirmed against a live VM in this environment.
        vm_network_data: >-
          {{
            {
              'network': {
                'version': 1,
                'config': [{
                  'type': 'physical',
                  'name': 'eth0',
                  'subnets': [{
                    'type': 'dhcp4',
                    'routes': [{
                      'network': '0.0.0.0',
                      'netmask': '0.0.0.0',
                      'gateway': vm_subnet_gateway
                    }],
                    'dns_nameservers': [vm_cluster_dns_info.resources[0].spec.clusterIP],
                    'dns_search': [
                      compute_instance_target_namespace ~ '.svc.cluster.local',
                      'svc.cluster.local',
                      'cluster.local'
                    ]
                  }]
                }]
              }
            } | to_nice_yaml
          }}
