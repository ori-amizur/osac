- name: Static AAP instance-group pod specs
  hosts: localhost
  gather_facts: false
  vars:
    _controller_vars_path: >-
      {{ playbook_dir }}/../../../../../collections/ansible_collections/osac/config_as_code/roles/aap/vars/controller.yml

  tasks:
    - name: Read static instance-group definitions
      ansible.builtin.set_fact:
        _controller_vars: "{{ lookup('ansible.builtin.file', _controller_vars_path) }}"

    - name: Assert static instance-group PodSpecs avoid AAP-rejected volume sources
      ansible.builtin.assert:
        that:
          - "_controller_vars is not search('secretName:')"
          - "_controller_vars is not search('serviceAccountToken:')"
          - "_controller_vars is not search('automountServiceAccountToken: true')"
        fail_msg: A static AAP instance-group PodSpec contains a rejected volume source.
