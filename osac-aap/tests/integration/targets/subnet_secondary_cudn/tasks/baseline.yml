---
# Integration test for cudn_net's Secondary-VirtualNetwork Subnet handling
# (namespaceSelector/role:Secondary CUDN, no per-subnet namespace, router pod
# Multus attachment). Exercises create_subnet.yaml directly.
#
# The resource tests require an OpenShift cluster with OVN-Kubernetes CUDN
# support. OSAC consumes that API; it does not install or own it. The complete
# Secondary Subnet path additionally depends on IPAMClaim and live UDN attach
# support, which is isolated from the CUDN contract test below.

# ── Test 1: Secondary Subnet creates no per-subnet namespace, correct CUDN facts ──
- name: "Subnet Secondary CUDN - Test create"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    test_vn_name: vn-sec-test
    test_vn_uuid: vn-sec-test-uuid
    test_subnet_name: subnet-sec-test
    # This play validates the CUDN contract. Live UDN attachment is exercised
    # separately; OVN-Kubernetes owns that controller and its support is not an
    # OSAC test prerequisite for creating the CUDN.
    cudn_net_manage_router_pod: false

  tasks:
    - name: Test Secondary Subnet provisioning
      block:
        - name: Set Secondary Subnet fact
          ansible.builtin.set_fact:
            subnet:
              metadata:
                name: "{{ test_subnet_name }}"
                namespace: osac-networking
                labels:
                  osac.openshift.io/subnet-uuid: "{{ test_subnet_name }}-uuid"
                annotations:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/networking-type: Secondary
                  osac.openshift.io/virtual-network-name: "{{ test_vn_name }}"
              spec:
                virtualNetwork: "{{ test_vn_uuid }}"
                ipv4Cidr: 10.4.1.0/24
            subnet_name: "{{ test_subnet_name }}"

        - name: Create the shared Secondary VirtualNetwork namespace
          kubernetes.core.k8s:
            state: present
            api_version: v1
            kind: Namespace
            definition:
              metadata:
                name: "{{ test_vn_name }}"
                annotations:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/owner-reference: "{{ test_vn_uuid }}"
                labels:
                  >-
                    {{ {
                      'osac.openshift.io/managed-by': 'osac-fulfillment',
                      'osac.openshift.io/tenant': 'test-tenant',
                      ('secondary-vn.osac.openshift.io/' ~ test_vn_uuid): 'true'
                    } }}

        - name: Run cudn_net create_subnet
          ansible.builtin.include_role:
            name: osac.templates.cudn_net
            tasks_from: create_subnet

        - name: Get any namespace matching the Subnet's own name
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ test_subnet_name }}"
          register: subnet_namespace_result

        - name: Assert no dedicated namespace was created for a Secondary Subnet
          ansible.builtin.assert:
            that:
              - subnet_namespace_result.resources | length == 0
            fail_msg: "A dedicated namespace was unexpectedly created for a Secondary Subnet"
            success_msg: "Secondary Subnet namespace-skip: passed"

        - name: Assert the CUDN namespaceSelector and layer2 role facts are correct
          ansible.builtin.assert:
            that:
              - "subnet_cudn_namespace_selector == {'secondary-vn.osac.openshift.io/' ~ test_vn_uuid: 'true'}"
              - subnet_cudn_layer2_role == 'Secondary'
            fail_msg: "CUDN namespaceSelector/layer2 role not computed correctly for a Secondary Subnet"
            success_msg: "Secondary Subnet CUDN facts: passed"

        - name: Get the created Secondary CUDN
          kubernetes.core.k8s_info:
            api_version: k8s.ovn.org/v1
            kind: ClusterUserDefinedNetwork
            name: "{{ test_subnet_name }}"
          register: secondary_cudn_result

        - name: Assert the Secondary CUDN was created with the requested contract
          ansible.builtin.assert:
            that:
              - secondary_cudn_result.resources | length == 1
              - secondary_cudn_result.resources[0].spec.network.topology == 'Layer2'
              - secondary_cudn_result.resources[0].spec.network.layer2.role == 'Secondary'
              - secondary_cudn_result.resources[0].spec.network.layer2.subnets == ['10.4.1.0/24']
              - >-
                secondary_cudn_result.resources[0].spec.namespaceSelector.matchLabels ==
                {'secondary-vn.osac.openshift.io/' ~ test_vn_uuid: 'true'}
            fail_msg: "Secondary CUDN was not created with the requested network contract"
            success_msg: "Secondary CUDN resource: passed"

      always:
        - name: Cleanup -- delete the Secondary Subnet CUDN
          kubernetes.core.k8s:
            state: absent
            api_version: k8s.ovn.org/v1
            kind: ClusterUserDefinedNetwork
            name: "{{ test_subnet_name }}"
            wait: true
            wait_timeout: 60
          failed_when: false

        - name: Cleanup -- delete the Secondary VirtualNetwork namespace
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ test_vn_name }}"
            wait: true
            wait_timeout: 60
          failed_when: false

# ── Test 2: Primary Subnet still creates its own dedicated namespace (regression) ──
- name: "Subnet Secondary CUDN - Test Primary is unaffected"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    test_vn_uuid: vn-for-subnet-primary-test-uuid
    test_subnet_name: subnet-primary-cudn-test

  tasks:
    - name: Test Primary Subnet provisioning
      block:
        - name: Set Primary Subnet fact
          ansible.builtin.set_fact:
            subnet:
              metadata:
                name: "{{ test_subnet_name }}"
                namespace: osac-networking
                labels:
                  osac.openshift.io/subnet-uuid: "{{ test_subnet_name }}-uuid"
                annotations:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/virtual-network-name: vn-for-subnet-primary-test
                  # networking-type omitted -- defaults to Primary
              spec:
                virtualNetwork: "{{ test_vn_uuid }}"
                ipv4Cidr: 10.4.2.0/24
            subnet_name: "{{ test_subnet_name }}"

        - name: Run cudn_net create_subnet
          ansible.builtin.include_role:
            name: osac.templates.cudn_net
            tasks_from: create_subnet

        - name: Get the Subnet's own dedicated namespace
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ test_subnet_name }}"
          register: subnet_namespace_result

        - name: Assert the dedicated namespace was created for a Primary Subnet
          ansible.builtin.assert:
            that:
              - subnet_namespace_result.resources | length == 1
              - subnet_namespace_result.resources[0].metadata.labels['osac.openshift.io/subnet-id'] == test_subnet_name ~ '-uuid'
              - subnet_namespace_result.resources[0].metadata.labels['osac.openshift.io/virtual-network'] == test_vn_uuid
            fail_msg: "Primary Subnet's dedicated namespace not created correctly"
            success_msg: "Primary Subnet namespace: passed"

        - name: Assert the CUDN namespaceSelector and layer2 role facts are unchanged for Primary
          ansible.builtin.assert:
            that:
              - "subnet_cudn_namespace_selector == {'osac.openshift.io/subnet-id': test_subnet_name ~ '-uuid'}"
              - subnet_cudn_layer2_role == 'Primary'
            fail_msg: "CUDN namespaceSelector/layer2 role changed for a Primary Subnet"
            success_msg: "Primary Subnet CUDN facts: passed"

      always:
        - name: Cleanup -- delete the Primary Subnet CUDN
          kubernetes.core.k8s:
            state: absent
            api_version: k8s.ovn.org/v1
            kind: ClusterUserDefinedNetwork
            name: "{{ test_subnet_name }}"
            wait: true
            wait_timeout: 60
          failed_when: false

        - name: Cleanup -- delete the Subnet's dedicated namespace
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ test_subnet_name }}"
          failed_when: false

# ── Test 3: router pod Multus network-selection list computation (in isolation) ──
# Validates the exact JSON-array list-manipulation expressions used in create_subnet.yaml's
# "Compute updated router pod Multus network selection list" and delete_subnet.yaml's mirror.
- name: "Subnet Secondary CUDN - Test router pod attachment-list computation"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Compute attachment list starting from no existing annotation (add subnet-a)
      ansible.builtin.set_fact:
        computed_networks: >-
          {{
            ('[]' | from_json | rejectattr('name', 'equalto', 'subnet-a') | list)
            + [{'name': 'subnet-a', 'interface': 'subnet-a', 'ipam-claim-reference': 'subnet-a'}]
          }}

    - name: Assert first attachment is added correctly
      ansible.builtin.assert:
        that:
          - computed_networks | map(attribute='name') | list == ['subnet-a']
          - computed_networks[0]['ipam-claim-reference'] == 'subnet-a'
        fail_msg: "Adding the first subnet attachment did not produce the expected list"
        success_msg: "First attachment add: passed"

    - name: Compute attachment list adding a second subnet (subnet-b) to an existing one
      ansible.builtin.set_fact:
        computed_networks: >-
          {{
            (computed_networks | rejectattr('name', 'equalto', 'subnet-b') | list)
            + [{'name': 'subnet-b', 'interface': 'subnet-b', 'ipam-claim-reference': 'subnet-b'}]
          }}

    - name: Assert second attachment is added without dropping the first
      ansible.builtin.assert:
        that:
          - computed_networks | map(attribute='name') | sort | list == ['subnet-a', 'subnet-b']
        fail_msg: "Adding a second subnet attachment did not preserve the first"
        success_msg: "Second attachment add: passed"

    - name: Compute attachment list re-adding an already-attached subnet (idempotency)
      ansible.builtin.set_fact:
        computed_networks: >-
          {{
            (computed_networks | rejectattr('name', 'equalto', 'subnet-a') | list)
            + [{'name': 'subnet-a', 'interface': 'subnet-a', 'ipam-claim-reference': 'subnet-a'}]
          }}

    - name: Assert re-adding an existing attachment does not duplicate it
      ansible.builtin.assert:
        that:
          - computed_networks | map(attribute='name') | sort | list == ['subnet-a', 'subnet-b']
        fail_msg: "Re-adding an existing attachment produced a duplicate"
        success_msg: "Idempotent re-add: passed"

    - name: Compute attachment list removing one of two subnets
      ansible.builtin.set_fact:
        computed_networks: "{{ computed_networks | rejectattr('name', 'equalto', 'subnet-a') | list }}"

    - name: Assert removing one attachment leaves the other
      ansible.builtin.assert:
        that:
          - computed_networks | map(attribute='name') | list == ['subnet-b']
        fail_msg: "Removing one of two attachments did not leave the other intact"
        success_msg: "Partial removal: passed"

    - name: Compute attachment list removing the last remaining subnet
      ansible.builtin.set_fact:
        computed_networks: "{{ computed_networks | rejectattr('name', 'equalto', 'subnet-b') | list }}"

    - name: Assert removing the last attachment leaves an empty, serializable list
      ansible.builtin.assert:
        that:
          - computed_networks == []
          - (computed_networks | to_json) == '[]'
        fail_msg: "Removing the last attachment did not leave a clean empty list"
        success_msg: "Full removal: passed"

    - name: Compute the gateway address for a subnet CIDR
      ansible.builtin.set_fact:
        computed_gateway: "{{ '10.4.1.0/24' | ansible.utils.ipaddr('1') }}"

    - name: Assert the gateway address is the CIDR's first host address
      ansible.builtin.assert:
        that:
          - computed_gateway == '10.4.1.1/24'
        fail_msg: "Gateway address computation did not produce the expected .1 address"
        success_msg: "Gateway address computation: passed"

    - name: Compute the IPAMClaim status patch payload
      ansible.builtin.set_fact:
        computed_status_patch: "{{ {'status': {'ips': [computed_gateway]}} | to_json }}"

    - name: Assert the status patch payload round-trips correctly
      ansible.builtin.assert:
        that:
          - (computed_status_patch | from_json).status.ips == [computed_gateway]
        fail_msg: "IPAMClaim status patch payload was not constructed correctly"
        success_msg: "IPAMClaim status patch payload: passed"

# ── Test 4: patch the running router Pod without changing its identity ──
# This exercises the live-attach task directly. OVN-Kubernetes/Multus owns the
# subsequent interface injection; this test verifies that OSAC changes the Pod in
# place and preserves unrelated annotations.
- name: "Subnet Secondary CUDN - Test live router pod annotation patch"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    test_live_attach_namespace: subnet-live-attach-test
    test_live_attach_vn_name: subnet-live-attach-test
    test_live_attach_existing_subnet_name: subnet-live-attach-existing
    test_live_attach_subnet_name: subnet-live-attach-a

  tasks:
    - name: Test live router pod annotation patch
      block:
        - name: Create the live-attach test namespace
          kubernetes.core.k8s:
            state: present
            api_version: v1
            kind: Namespace
            definition:
              metadata:
                name: "{{ test_live_attach_namespace }}"
                annotations:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/owner-reference: subnet-live-attach-test
                labels:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/owner-reference: subnet-live-attach-test

        - name: Create a running router pod
          kubernetes.core.k8s:
            state: present
            api_version: v1
            kind: Pod
            namespace: "{{ test_live_attach_namespace }}"
            definition:
              metadata:
                name: router
                annotations:
                  osac.openshift.io/tenant: test-tenant
                  osac.openshift.io/owner-reference: subnet-live-attach-test
                  osac.test/preserve: keep-me
                labels:
                  osac.openshift.io/managed-by: osac-fulfillment
                  osac.openshift.io/router-pod: "true"
                  osac.openshift.io/virtual-network: "{{ test_live_attach_vn_name }}"
              spec:
                restartPolicy: Never
                containers:
                  - name: router
                    image: registry.k8s.io/pause:3.9
                    imagePullPolicy: IfNotPresent

        - name: Wait for the test router pod to run
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ test_live_attach_namespace }}"
            name: router
          register: initial_router_pod_info
          until:
            - initial_router_pod_info.resources | length == 1
            - initial_router_pod_info.resources[0].status.phase | default('') == 'Running'
          retries: 30
          delay: 2

        - name: Save the test router pod UID
          ansible.builtin.set_fact:
            initial_router_pod_uid: "{{ initial_router_pod_info.resources[0].metadata.uid }}"

        - name: Patch the running router pod through the cudn_net live-attach task
          ansible.builtin.include_role:
            name: osac.templates.cudn_net
            tasks_from: patch_router_pod_networks
          vars:
            subnet_vn_name: "{{ test_live_attach_vn_name }}"
            router_pod_networks:
              - name: "{{ test_live_attach_existing_subnet_name }}"
                interface: existing0
              - name: "{{ test_live_attach_subnet_name }}"
                interface: new0
                ipam-claim-reference: "{{ test_live_attach_subnet_name }}"

        - name: Get the patched router pod
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ test_live_attach_namespace }}"
            name: router
          register: patched_router_pod_info

        - name: Assert the live attachment changed only the Pod annotation
          ansible.builtin.assert:
            that:
              - patched_router_pod_info.resources | length == 1
              - patched_router_pod_info.resources[0].metadata.uid == initial_router_pod_uid
              - patched_router_pod_info.resources[0].metadata.annotations['osac.test/preserve'] == 'keep-me'
              - >-
                (
                  patched_router_pod_info.resources[0].metadata.annotations['k8s.v1.cni.cncf.io/networks']
                  | from_json
                  | map(attribute='name')
                  | list
                ) == [test_live_attach_existing_subnet_name, test_live_attach_subnet_name]
            fail_msg: "Live attachment did not patch the existing router Pod as expected"
            success_msg: "Live router pod annotation patch: passed"

      always:
        - name: Cleanup -- delete live-attach test namespace
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ test_live_attach_namespace }}"
            wait: true
            wait_timeout: 60
          failed_when: false
