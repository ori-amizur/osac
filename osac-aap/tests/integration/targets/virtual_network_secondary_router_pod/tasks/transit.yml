---
# EVPN transit contract test. This scenario intentionally injects the
# VN-scoped manager-neutral data that the Netris role publishes, so it can
# validate the k8s-side CUDN/claim contract without requiring live Netris
# credentials. Run it on a cluster with the EVPN CUDN feature enabled.

- name: "VirtualNetwork Secondary router pod - EVPN transit contract"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    test_vn_name: vn-secondary-router-pod-transit-test
    test_vn_uuid: vn-secondary-router-pod-transit-test-uuid
    virtual_network_name: "{{ test_vn_name }}"
    cudn_net_evpn_transit_cudn_name: osac-evpn-transit-test
    # This SNO does not have the EVPN/VTEP feature enabled. The contract test
    # verifies the accepted CUDN/claim specification; an EVPN-enabled cluster
    # should use the production default and exercise status readiness as well.
    cudn_net_evpn_transit_wait_ready: false
    cudn_net_evpn_transit_patch_port_security: false
    cudn_net_evpn_transit_data:
      cidr: 10.250.0.0/24
      netris_pool: 10.250.0.0/26
      osac_pool: 10.250.0.64/26
      mac_vrf_vni: "65001"
      vtep: tenant-vtep
      reserved_subnets: '["10.250.0.0/26", "10.250.0.128/25"]'

  tasks:
    - name: Set fabric-backed Secondary VirtualNetwork fact
      ansible.builtin.set_fact:
        virtual_network:
          metadata:
            name: "{{ test_vn_name }}"
            namespace: osac-networking
            labels:
              osac.openshift.io/virtualnetwork-uuid: "{{ test_vn_uuid }}"
            annotations:
              osac.openshift.io/tenant: test-tenant
              osac.openshift.io/fabric-manager-configured: "true"
              osac.openshift.io/transit-capability: netris-evpn
          spec:
            region: test-region
            networkClass: netris-cudn-net
            networkingType: Secondary

    - name: Create the fabric-backed router resources
      ansible.builtin.include_role:
        name: osac.templates.cudn_net
        tasks_from: create_virtual_network

    - name: Wait for the transit router Deployment to become available
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ test_vn_name }}"
        name: router
      register: transit_deployment_ready
      until:
        - transit_deployment_ready.resources | length == 1
        - transit_deployment_ready.resources[0].status.availableReplicas | default(0) | int == 1
      retries: 60
      delay: 2
      when: cudn_net_evpn_transit_wait_ready | bool

    - name: Read the running transit router Pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ test_vn_name }}"
        label_selectors:
          - osac.openshift.io/router-pod=true
      register: transit_running_pods
      until:
        - transit_running_pods.resources | length == 1
        - transit_running_pods.resources[0].status.phase == 'Running'
        - >-
          transit_running_pods.resources[0].status.containerStatuses | default([])
          | selectattr('ready', 'equalto', true) | list | length == 1
      retries: 60
      delay: 2
      when: cudn_net_evpn_transit_wait_ready | bool

    - name: Display the live transit router Pod network annotations
      ansible.builtin.debug:
        msg: "{{ transit_running_pods.resources[0].metadata.annotations | default({}) }}"
      when: cudn_net_evpn_transit_wait_ready | bool

    - name: Read the VN-scoped transit CUDN
      kubernetes.core.k8s_info:
        api_version: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: "{{ cudn_net_evpn_transit_cudn_name }}"
      register: transit_cudn

    - name: Assert the VN-scoped CUDN has the expected EVPN MAC-VRF only
      ansible.builtin.assert:
        that:
          - transit_cudn.resources | length == 1
          - transit_cudn.resources[0].spec.network.topology == 'Layer2'
          - transit_cudn.resources[0].spec.network.transport == 'EVPN'
          - transit_cudn.resources[0].spec.network.layer2.role == 'Primary'
          - transit_cudn.resources[0].spec.network.layer2.ipam.lifecycle == 'Persistent'
          - transit_cudn.resources[0].spec.network.layer2.subnets == ['10.250.0.0/24']
          - transit_cudn.resources[0].spec.network.layer2.infrastructureSubnets == ['10.250.0.64/30']
          - transit_cudn.resources[0].spec.network.layer2.reservedSubnets == ['10.250.0.0/26', '10.250.0.128/25']
          - transit_cudn.resources[0].spec.network.evpn.macVRF.vni == 65001
          - transit_cudn.resources[0].spec.network.evpn.ipVRF is not defined
          - transit_cudn.resources[0].metadata.annotations['osac.openshift.io/tenant'] == 'test-tenant'
          - transit_cudn.resources[0].metadata.annotations['osac.openshift.io/owner-reference'] == test_vn_uuid
          - transit_cudn.resources[0].spec.namespaceSelector.matchLabels['secondary-vn.osac.openshift.io/' ~ test_vn_uuid] == 'true'
        fail_msg: "EVPN transit CUDN does not match the MAC-VRF-only contract"

    - name: Read the router namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ test_vn_name }}"
      register: transit_namespace

    - name: Assert the namespace selects only this VN's primary CUDN
      ansible.builtin.assert:
        that:
          - transit_namespace.resources | length == 1
          - transit_namespace.resources[0].metadata.labels['osac.openshift.io/evpn-transit'] == 'true'
          - transit_namespace.resources[0].metadata.labels['k8s.ovn.org/primary-user-defined-network'] == ''

    - name: Read the router Deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ test_vn_name }}"
        name: router
      register: transit_deployment

    - name: Assert the router requests the persistent primary-UDN claim
      ansible.builtin.assert:
        that:
          - transit_deployment.resources | length == 1
          - transit_deployment.resources[0].spec.template.metadata.annotations['k8s.ovn.org/primary-udn-ipamclaim'] == 'transit'

    - name: Read the persistent transit IPAMClaim
      kubernetes.core.k8s_info:
        api_version: k8s.cni.cncf.io/v1alpha1
        kind: IPAMClaim
        namespace: "{{ test_vn_name }}"
        name: transit
      register: transit_claim

    - name: Assert the transit claim references this VN's CUDN
      ansible.builtin.assert:
        that:
          - transit_claim.resources | length == 1
          - transit_claim.resources[0].spec.network == cudn_net_evpn_transit_cudn_name
          - transit_claim.resources[0].spec.interface == 'transit'
          - transit_claim.resources[0].metadata.annotations['osac.openshift.io/tenant'] == 'test-tenant'
          - transit_claim.resources[0].metadata.annotations['osac.openshift.io/owner-reference'] == test_vn_uuid

    - name: Remove the transit test router Deployment
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ test_vn_name }}"
        name: router
        delete_options:
          propagationPolicy: Background
      failed_when: false

    - name: Find transit test router Pods before namespace deletion
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ test_vn_name }}"
        label_selectors:
          - osac.openshift.io/router-pod=true
      register: transit_router_pods
      failed_when: false

    - name: Force-remove transit test router Pods
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        namespace: "{{ test_vn_name }}"
        name: "{{ item.metadata.name }}"
        delete_options:
          gracePeriodSeconds: 0
          propagationPolicy: Background
      loop: "{{ transit_router_pods.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: Cleanup the transit test IPAMClaim
      kubernetes.core.k8s:
        state: absent
        api_version: k8s.cni.cncf.io/v1alpha1
        kind: IPAMClaim
        namespace: "{{ test_vn_name }}"
        name: transit
      failed_when: false

    - name: Cleanup the transit test router pod SCC ClusterRoleBinding
      kubernetes.core.k8s:
        state: absent
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "router-pod-scc-{{ test_vn_name }}"
      failed_when: false

    - name: Cleanup the transit test CUDN
      kubernetes.core.k8s:
        state: absent
        api_version: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: "{{ cudn_net_evpn_transit_cudn_name }}"
        delete_options:
          propagationPolicy: Background
      failed_when: false

    - name: Cleanup the transit test namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ test_vn_name }}"
      failed_when: false

# A configured fabric manager that does not advertise the current Netris/EVPN
# contract must remain on the Phase-1-only router path.
- name: "VirtualNetwork Secondary router pod - unsupported transit capability"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml
  vars:
    unsupported_vn_name: vn-secondary-router-pod-unsupported-transit-test
    unsupported_vn_uuid: vn-secondary-router-pod-unsupported-transit-test-uuid
    virtual_network_name: "{{ unsupported_vn_name }}"

  tasks:
    - name: Set configured-but-unsupported Secondary VirtualNetwork fact
      ansible.builtin.set_fact:
        router_pod_transit_enabled: false
        router_pod_transit_attachment: {}
        virtual_network:
          metadata:
            name: "{{ unsupported_vn_name }}"
            namespace: osac-networking
            labels:
              osac.openshift.io/virtualnetwork-uuid: "{{ unsupported_vn_uuid }}"
            annotations:
              osac.openshift.io/tenant: test-tenant
              osac.openshift.io/fabric-manager-configured: "true"
              osac.openshift.io/transit-capability: unsupported
          spec:
            region: test-region
            networkClass: unsupported-fabric-net
            networkingType: Secondary

    - name: Create the unsupported-backend router resources
      ansible.builtin.include_role:
        name: osac.templates.cudn_net
        tasks_from: create_virtual_network

    - name: Verify that no EVPN transit CUDN was created
      kubernetes.core.k8s_info:
        api_version: k8s.ovn.org/v1
        kind: ClusterUserDefinedNetwork
        name: "osac-transit-cudn-{{ (unsupported_vn_uuid | hash('sha1'))[:12] }}"
      register: unsupported_transit_cudn
      failed_when: false

    - name: Verify that no persistent transit IPAMClaim was created
      kubernetes.core.k8s_info:
        api_version: k8s.cni.cncf.io/v1alpha1
        kind: IPAMClaim
        namespace: "{{ unsupported_vn_name }}"
        name: "osac-transit-{{ (unsupported_vn_uuid | hash('sha1'))[:12] }}"
      register: unsupported_transit_claim
      failed_when: false

    - name: Assert unsupported transit remains Phase-1-only
      ansible.builtin.assert:
        that:
          - unsupported_transit_cudn.resources | default([]) | length == 0
          - unsupported_transit_claim.resources | default([]) | length == 0

  post_tasks:
    - name: Cleanup unsupported-backend router pod SCC ClusterRoleBinding
      kubernetes.core.k8s:
        state: absent
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "router-pod-scc-{{ unsupported_vn_name }}"
      failed_when: false

    - name: Cleanup unsupported-backend router namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ unsupported_vn_name }}"
      failed_when: false
