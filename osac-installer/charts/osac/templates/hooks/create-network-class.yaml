{{- if .Values.networkClass.enabled }}
{{- $egressRules := list -}}
{{- range .Values.networkClass.defaults.egressRules }}
{{- $rule := dict "protocol" .protocol -}}
{{- if .ipv4Cidr }}{{ $_ := set $rule "ipv4_cidr" .ipv4Cidr }}{{ end -}}
{{- if .ipv6Cidr }}{{ $_ := set $rule "ipv6_cidr" .ipv6Cidr }}{{ end -}}
{{- if .portFrom }}{{ $_ := set $rule "port_from" .portFrom }}{{ end -}}
{{- if .portTo }}{{ $_ := set $rule "port_to" .portTo }}{{ end -}}
{{- $egressRules = append $egressRules $rule -}}
{{- end }}
{{- $body := dict
      "title" (required "networkClass.title is required when networkClass.enabled is true" .Values.networkClass.title)
      "is_default" .Values.networkClass.isDefault
      "spec" (dict "defaults" (dict
        "virtual_network_ipv4_cidr" .Values.networkClass.defaults.virtualNetworkIPv4CIDR
        "subnet_ipv4_cidr" .Values.networkClass.defaults.subnetIPv4CIDR
        "enable_nat_gateway" .Values.networkClass.defaults.enableNatGateway
        "egress_rules" $egressRules
      ))
    -}}
{{- if .Values.networkClass.description }}{{ $_ := set $body "description" .Values.networkClass.description }}{{ end -}}
{{- if .Values.networkClass.k8sManager }}{{ $_ := set $body "k8s_manager" .Values.networkClass.k8sManager }}{{ end -}}
{{- if .Values.networkClass.fabricManager }}{{ $_ := set $body "fabric_manager" .Values.networkClass.fabricManager }}{{ end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-network-class
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      serviceAccountName: admin
      initContainers:
      {{- include "osac.waitForFulfillment" . | nindent 6 }}
      containers:
      - name: create-network-class
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            AUTH_TOKEN=$(< /var/run/secrets/kubernetes.io/serviceaccount/token)
            API="https://fulfillment-internal-api:8001/api/private/v1/network_classes"
            RESPONSE=/tmp/nc-response.json

            # The API derives metadata.name from k8s_manager/fabric_manager.  A
            # re-install therefore sees the same NetworkClass name even though
            # the create request itself carries a fresh ID.  Check the existing
            # object first so a duplicate-name response is handled as the
            # idempotent success it is, rather than being misreported by the API
            # as a concurrent default swap.
            EXISTING=$(curl -skS \
              --connect-timeout 5 --max-time 30 \
              "${API}" \
              -H "Authorization: Bearer ${AUTH_TOKEN}" || true)
            if echo "${EXISTING}" | python3 -c '
            import json, os, sys
            try:
                items = json.load(sys.stdin).get("items", [])
            except (json.JSONDecodeError, AttributeError):
                sys.exit(1)
            for item in items:
                metadata = item.get("metadata", {})
                if (metadata.get("name") == os.environ["NETWORK_CLASS_NAME"]
                        and item.get("title") == os.environ["NETWORK_CLASS_TITLE"]
                        and item.get("k8s_manager") == os.environ["NETWORK_CLASS_K8S_MANAGER"]
                        and item.get("is_default") is True):
                    sys.exit(0)
            sys.exit(1)
            '; then
              echo "NetworkClass ${NETWORK_CLASS_NAME} already exists with the desired configuration."
              exit 0
            fi

            CODE=$(curl -skS \
              --connect-timeout 5 --max-time 30 \
              -o "${RESPONSE}" -w '%{http_code}' \
              -X POST "${API}" \
              -H "Authorization: Bearer ${AUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary {{ $body | toJson | quote }})

            case "${CODE}" in
              2??)
                echo "NetworkClass created."
                ;;
              409)
                echo "NetworkClass already exists, skipping."
                ;;
              *)
                echo "ERROR: Failed to create NetworkClass (HTTP ${CODE})" >&2
                cat "${RESPONSE}" >&2
                exit 1
                ;;
            esac
        env:
        - name: HOME
          value: /tmp
        - name: NETWORK_CLASS_NAME
          value: {{ if .Values.networkClass.fabricManager }}{{ .Values.networkClass.fabricManager | replace "_" "-" | quote }}{{ else }}{{ .Values.networkClass.k8sManager | replace "_" "-" | quote }}{{ end }}
        - name: NETWORK_CLASS_TITLE
          value: {{ .Values.networkClass.title | quote }}
        - name: NETWORK_CLASS_K8S_MANAGER
          value: {{ .Values.networkClass.k8sManager | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: OnFailure
{{- end }}
